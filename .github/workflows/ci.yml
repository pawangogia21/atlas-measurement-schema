name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: ./mvnw -B verify

    - name: Schema lint (TODO AT-2/AT-16)
      run: echo "no schemas yet"

    - name: Avro compatibility gate (TODO AT-2)
      run: echo "no schemas yet"
